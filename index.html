<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F3EEE4" />
    <title>HueBricks</title>
    <link rel="icon" href="./assets/sprites/logo_sprite_0.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Inter:wght@500;700&family=Outfit:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #F3EEE4;
        overflow: hidden;
        font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overscroll-behavior: none;
      }
      body {
        box-sizing: border-box;
        /* keep the side rails clear of notches and screen edges on phones */
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        transition: background 180ms ease-out;
      }
      @media (orientation: portrait) {
        body {
          padding-left: max(env(safe-area-inset-left, 0px), 12px);
          padding-right: max(env(safe-area-inset-right, 0px), 12px);
        }
      }
      #game {
        display: block;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        image-rendering: auto;
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(60, 40, 20, 0.18), 0 2px 8px rgba(60, 40, 20, 0.08);
      }
      body[data-theme="classic"] #game {
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
      }
      #loading {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading"></div>
    <canvas id="game"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
